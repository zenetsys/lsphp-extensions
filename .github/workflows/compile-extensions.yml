name: Compilar Extensiones MongoDB para LSPHP

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'Versión de LSPHP a compilar (ej. 8.3)'
        required: true
        default: '8.3'
        type: choice
        options:
          - 8.3
          - 8.4

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar repositorios y dependencias base
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y software-properties-common curl wget
          
          # Agregar PPA de PHP
          sudo -n add-apt-repository -y ppa:ondrej/php
          
          # Agregar repositorio oficial de LiteSpeed
          wget -O - https://repo.litespeed.sh | bash
          
          sudo -n apt-get update

      - name: Instalar LSPHP y herramientas de compilación
        run: |
          sudo -n apt-get install -y build-essential libssl-dev pkg-config lsphp83 lsphp83-dev php-pear

      - name: Compilar extensión MongoDB vía PECL
        run: |
          /usr/local/lsws/lsphp83/bin/pecl install mongodb

      - name: Organizar archivos compilados
        run: |
          mkdir -p compiled/lsphp83
          EXTENSION_PATH=$(/usr/local/lsws/lsphp83/bin/php-config --extension-dir)
          cp "$EXTENSION_PATH/mongodb.so" compiled/lsphp83/
          echo "extension=mongodb.so" > compiled/lsphp83/mongodb.ini

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-lsphp83
          path: compiled/lsphp83/
