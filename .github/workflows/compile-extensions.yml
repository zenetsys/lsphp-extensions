name: Compilar Extensión MongoDB para LSPHP 8.3 - test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar repositorio LiteSpeed
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y curl wget

          sudo -n wget -O - https://repo.litespeed.sh | sudo -n bash

          sudo -n apt-get update

      - name: Instalar LSPHP y herramientas
        run: |
          sudo -n apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            autoconf \
            automake \
            libtool \
            lsphp83 \
            lsphp83-dev \
            lsphp83-pear

      - name: Verificar LSPHP
        run: |
          /usr/local/lsws/lsphp83/bin/php -v
          /usr/local/lsws/lsphp83/bin/phpize -v
          /usr/local/lsws/lsphp83/bin/php-config --version
          /usr/local/lsws/lsphp83/bin/pecl version

      - name: Compilar extensión MongoDB
        run: |
          sudo -n /usr/local/lsws/lsphp83/bin/pecl install mongodb

      - name: Organizar archivos compilados
        run: |
          mkdir -p compiled/lsphp83

          EXTENSION_PATH=$(
            /usr/local/lsws/lsphp83/bin/php-config --extension-dir
          )

          cp "$EXTENSION_PATH/mongodb.so" \
            compiled/lsphp83/mongodb.so

          echo "extension=mongodb.so" \
            > compiled/lsphp83/mongodb.ini

      - name: Verificar extensión MongoDB
        run: |
          EXTENSION_PATH=$(
            /usr/local/lsws/lsphp83/bin/php-config --extension-dir
          )

          /usr/local/lsws/lsphp83/bin/php \
            -d extension="$EXTENSION_PATH/mongodb.so" \
            -m | grep -i mongodb

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-lsphp83
          path: compiled/lsphp83/
